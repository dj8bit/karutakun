  <title>かるたくん</title>
  <link href="css/index.css" rel="stylesheet" type="text/css">


  <script src="js/jquery-3.4.1.min.js" type="text/javascript"></script>
  <script src="js/jquery.easing.1.3.js" type="text/javascript"></script>
  <script src="js/index.js" type="text/javascript"></script>
</head>

<body>
  <h1>かるたくん</h1>
  <div id="outGame">
    <button onclick="startKaruta()">はじめる</button>
  </div>

  <div id="inGame">
    <button onclick="nextKaruta()" id="nextButton">次を読む</button>
    <button onclick="stopKaruta()">やめる</button>
  </div>


  <script>
    var json = [
      '青い帽子、赤い帽子、ぐりとぐら',
      '苺が一杯、おいしそう',
      'うさぎのギック、海に出る',
      '襟巻巻いた、駅長さん',
      'おしくらまんじゅう、押せ押せ狼',
      'からすの買い物、からかさ一本',
      'きつねくん、切符を持って汽車に乗る',
      '熊くん くすくす くすぐったい',
      '毛虫が編んだ、毛糸の腹巻き',
      '子豚 困って こんな顔',
      '逆立ち さすが、お猿のサーカス',
      '知らぬまに、 シルクハットに 白い鳩',
      'すずめ 澄まして すみれの冠',
      'せい伸びしながら 背比べ',
      '揃って行きたい空の旅',
      '体操したら、たちまちスマート',
      'ちょっぴり小さいこのチョッキ',
      'つららキラキラ、つきよに光る',
      'てんとう虫 テントに とまれ',
      '虎が 得意の トランポリン',
      '仲良し 泣いた、仲良く泣いた',
      '兄さん にこにこ、にんじん食べる',
      '濡れた長靴、脱いで かわかす',
      '猫トラ トラ猫 招き猫',
      '呑気な猪、野原で のんびり',
      'はてなふむ、「ははん」と分かる めい探偵',
      '羊が ひなたで 昼ごはん',
      '太って 膨らむ ふうふうお餅',
      '下手でも平気、元気に 歌え',
      '星が 欲しいと 吠える犬',
      '窓から お出かけ 魔法使い',
      '緑のライオン、耳まで 緑',
      '胸まで 伸びた 麦ばたけ',
      '眼鏡の下から 横目で目くばせ',
      'もうできたかと、も一度覗く',
      'やぎさん やっぱり 山が好き',
      '雪の日 愉快な 雪だるま',
      '汚した洋服、洗って よそゆき',
      'らくだ らくらく ラッパ吹く',
      'りすの リュックは りんごで一杯',
      '留守番いるかと イルカが 聞いた',
      'れんこん ひときれ、レモン ふた切れ',
      '蝋燭 六本、ろばさん六歳',
      'わにどん わははと 大笑い'
    ];

    var fuda = [];
    var now = 0;


    stopKaruta();

    function startKaruta() {
      fuda = [...shuffleArray(json)];
      now = 0;
      nextKaruta();
      document.getElementById("outGame").style.display = "none";
      document.getElementById("inGame").style.display = "block";
    }

    function nextKaruta() {
      document.getElementById("nextButton").disabled = true;
      setTimeout(function() {
        yomiage(fuda[now]);
      }, 1000 + (Math.random() * 2000));
      now++;
      if (now == fuda.length) {
        stopKaruta();
      }
    }

    function stopKaruta() {
      document.getElementById("inGame").style.display = "none";
      document.getElementById("outGame").style.display = "block";
      now = 0;
    }


    function yomiage(text) {
      if ('speechSynthesis' in window) {
        var uttr = new SpeechSynthesisUtterance();
        uttr.text = text;
        window.speechSynthesis.speak(uttr);
        uttr.onend = function(event) {
          document.getElementById("nextButton").disabled = false;
        };
      } else {
        alert('Web Speech非対応ブラウザです');
      }
    }


    const shuffleArray = (array) => {
      const cloneArray = [...array];

      const result = cloneArray.reduce((_, cur, idx) => {
        let rand = Math.floor(Math.random() * (idx + 1));
        cloneArray[idx] = cloneArray[rand]
        cloneArray[rand] = cur;
        return cloneArray
      })

      return result;
    }
  </script>

</body>

</html>
