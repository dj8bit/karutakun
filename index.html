<!DOCTYPE HTML>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- PWA関連のメタタグ -->
  <meta name="theme-color" content="#4CAF50">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="かるたくん">
  <meta name="description" content="音声付きかるた学習アプリ">
  
  <!-- PWAマニフェスト -->
  <link rel="manifest" href="./manifest.json">
  
  <!-- アイコン -->
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./icons/icon-16x16.png">
  <link rel="apple-touch-icon" href="./icons/icon-192x192.png">

  <title>かるたくん</title>
  <link href="css/index.css" rel="stylesheet" type="text/css">


  <script src="js/jquery-3.4.1.min.js" type="text/javascript"></script>
  <script src="js/jquery.easing.1.3.js" type="text/javascript"></script>
  <script src="js/index.js" type="text/javascript"></script>
  
  <!-- Service Worker登録 -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((registration) => {
            console.log('Service Worker登録成功:', registration.scope);
          })
          .catch((error) => {
            console.log('Service Worker登録失敗:', error);
          });
      });
    }
  </script>
</head>

<body>
  <h1>かるたくん</h1>
  <div id="outGame">
    <div>
      <select id="karutaSelect">
        <option value="">👇かるたを えらんでね👇</option>
      </select>
    </div>
    <div>
      <select id="speakerSelect">
        <option value="">👇よむ人を えらんでね👇</option>
      </select>
    </div>
    <button id="startButton">はじめる</button>
  </div>

  <div id="inGame">
    <button id="nextButton">次を読む</button>
    <div class="progress-container">
      <progress id="progressBar" value="0" max="100"></progress>
      <div id="progressText">0 / 0</div>
    </div>
    <audio controls autoplay></audio>
    <button id="stopButton">やめる</button>

  </div>

</body>

</html>
